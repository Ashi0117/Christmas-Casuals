[project]
name = "data3001"
version = "0.1.0"
description = "Forecasting the duration and SST impact of coastal El Niño and La Niña events in the Humboldt Current from Clouddrift drifter data"
readme = "README.md"
authors = [
    { name = "andrebaruah", email = "baruahandre@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cartopy>=0.22",
    "clouddrift>=0.48.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.2.0",
    "xarray<2026.9",  # newer xarray breaks the zarr 2 that clouddrift uses
    "zarr>=2.18,<3",
]

[tool.uv]
package = false   # analysis project: notebooks and scripts, not an installable package
