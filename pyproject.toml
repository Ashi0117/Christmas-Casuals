[project]
name = "data3001"
version = "0.1.0"
description = "Forecasting the duration and SST impact of coastal El Niño and La Niña events in the Humboldt Current from Clouddrift drifter data"
readme = "README.md"
authors = [
    { name = "andrebaruah", email = "baruahandre@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cartopy>=0.26.0",
    "clouddrift>=0.48.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.2.0",
]

[tool.uv]
package = false   # analysis project: notebooks and scripts, not an installable package
